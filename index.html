<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale: a phone does not zoom into a form field it is typing in ("clicking in the name field does crazy stuff
         with panning and zooming", Carl, 3 Nov 2026); a visitor's own pinch still zooms on a phone that allows it -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <!-- THE SITE'S NAME AND ITS LINK PREVIEW, Carl's answers on the launch quiz (3 Nov 2026,
         https://claude.ai/artifact/5LWQs73jHMp7yRByiUZgP1): the tab "Carl Bahner"; a shared link shows the room as it
         opens, his name and his own line, "Mixer, educator, and sonic chaos gremlin." -->
    <!-- then the tab and the shared link's title say what he does: ""Carl Bahner // mixing and co-production"" (Carl, 9 Nov
         2026, the officers' fixes quiz; asked knowing it is also what a shared link shows) -->
    <title>Carl Bahner // mixing and co-production</title>
    <meta name="description" content="Mixer, educator, and sonic chaos gremlin." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carlbahner.com/" />
    <meta property="og:title" content="Carl Bahner // mixing and co-production" />
    <meta property="og:description" content="Mixer, educator, and sonic chaos gremlin." />
    <meta property="og:image" content="https://carlbahner.com/assets/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* the page round the room's card: Homegrown's quiet cream (tokens.css --paper) */
        background: #fefdf9;
      }
      /* THE ROOM'S CARD (src/stage.mjs): 16:9 whatever the window, centred, sized and placed by fitStage; its
         corner Homegrown's 12 and its line drawn over the room's edge (drawBox, front) */
      #stage {
        position: fixed;
        z-index: 0;
        border-radius: 12px;
        --line: #2c2c2a;
      }
      /* THE LOADING SCREEN: "we need a loading screen because things load-in at different times" (Carl, 3 Nov 2026). The
         room's cream over it, his CB drum logo turning in the middle ("can the record be the spinning cb logo?", Carl, 3 Nov
         2026; a record until then; art/site/cb-drum-logo.png in charcoal), until every drawing, the turntable's pieces and
         the fonts are in (src/studio.mjs `loaded`), then it fades. No words on it. */
      #loading {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #fcf7e8;
        cursor: progress;
        transition: opacity 0.6s ease, visibility 0s linear 0.6s;
      }
      #loading img {
        width: min(22%, 28vh);
        aspect-ratio: 1;
        object-fit: contain;
        animation: loading-turn 1.8s linear infinite;
      }
      @keyframes loading-turn {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading img {
          animation: none;
        }
      }
      body.loaded #loading {
        opacity: 0;
        visibility: hidden;
      }
      #stage > .wob.front {
        z-index: 3;
      }
      #stage > .wob.front path {
        fill: none;
      }
      #room {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #room.grabbing {
        cursor: grabbing;
      }
      #arrange {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 232px;
        max-height: calc(100% - 24px);
        overflow: auto;
        padding: 6px 8px;
        border: 1.5px solid #2c2c2a;
        border-radius: 10px;
        background: rgb(237 230 218 / 0.94);
        color: #2c2c2a;
        font:
          600 12px/1.2 system-ui,
          sans-serif;
      }
      #arrange[hidden],
      #arrange [hidden],
      #arrange.folded > :not(.editing) {
        display: none !important;
      }
      #arrange label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        min-height: 22px;
      }
      #arrange input[type="range"] {
        width: 120px;
        margin: 0;
      }
      #arrange input[type="color"] {
        width: 36px;
        height: 20px;
        padding: 0;
        border: 1px solid #2c2c2a;
        border-radius: 4px;
      }
      #arrange button {
        padding: 3px 8px;
        border: 1.5px solid #2c2c2a;
        border-radius: 8px;
        background: #f6cc60;
        color: #2c2c2a;
        font: inherit;
        cursor: pointer;
      }
      #arrange .editing {
        justify-content: flex-start;
      }
      #arrange.folded .editing,
      #arrange .editing {
        padding-bottom: 4px;
      }
      #arrange:not(.folded) .editing {
        border-bottom: 1.5px solid #2c2c2a;
      }
      #arrange .grip,
      #arrange .fold {
        padding: 0 6px;
        background: none;
        border: 0;
        font-size: 16px;
        line-height: 1;
      }
      #arrange .grip {
        cursor: move;
        touch-action: none;
      }
      #arrange .fold {
        margin-left: auto;
      }
      #arrange select {
        flex: 1;
        min-width: 0;
        font: inherit;
        padding: 2px 4px;
        border: 1.5px solid #2c2c2a;
        border-radius: 8px;
        background: #ede6da;
        color: #2c2c2a;
      }
      #arrange .modes {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
      }
      #arrange .modes button {
        padding: 2px 6px;
        background: #ede6da;
      }
      #arrange .modes button[aria-pressed="true"] {
        background: #2c2c2a;
        color: #ede6da;
      }
      /* ---------- THE WAY ROUND THE SITE (src/nav.mjs): the windows, in the room's own paper and line ---------- */
      /* DM Sans, Homegrown's body face (public/fonts/DMSans-latin.woff2, copied as assets/dmsans.woff2) */
      @font-face {
        font-family: "DM Sans";
        src: url("assets/dmsans.woff2") format("woff2");
        font-weight: 100 1000;
        font-display: swap;
      }
      @font-face {
        font-family: "DW Fairfield";
        src: url("assets/dwfairfield.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        --ink: #2c2c2a;
        /* THREE TEXT SIZES ON THE CARDS, every job one of them: Homegrown's rule (tokens.css, "Four text sizes, and every
           job has exactly one", Carl, 4 Sept 2026), taken here on his word: "what do we use in homegrown for size
           consistency?", shown it, then "yes" (3 Nov 2026). The site has no page title, so three: a heading, what you read
           (every paragraph, quote, button and what you type), and the small words (song lines and lengths, who said a
           quote, form labels). Body bigger than Homegrown's, as he asked of the cards on 2 Nov ("yeah", to bigger text);
           small is Homegrown's small against its body (0.8 to 0.95). Locked by tests/sizes.mjs. */
        --fs-heading: 1.7rem;
        --fs-body: 1.17rem;
        --fs-small: 0.985rem;
        --paper: #ede6da;
        --mustard: #f0af1b;
        --teal: #1f5a5e;
        --rust: #bf7538;
      }
      #room {
        transition: opacity 0.14s;
      }
      #room.faded {
        opacity: 0;
      }
      #things {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .win-open #things {
        visibility: hidden;
      }
      /* one button a thing, over it, for the keyboard: invisible, since the room draws its focus on the thing */
      .thing {
        position: absolute;
        padding: 0;
        border: 0;
        background: none;
        opacity: 0;
      }
      #veil {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #veil[hidden],
      #win[hidden],
      #turn[hidden] {
        display: none;
      }
      #win {
        position: absolute;
        z-index: 2;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 30px 28px 28px;
        /* A HOMEGROWN CARD (app.css .card, tokens.css): cream, its line 2px at the faded ink (--ink-clearly, 38%),
           drawn and still by drawBox in src/nav.mjs; no grain and no shadow, as Homegrown's cards have none.
           "you need to look at the css of homegrown to do the card design and boiling" (Carl, 1 Nov 2026) */
        background: none;
        --fill: #fcf7e8;
        --line: rgba(44, 44, 42, 0.38);
        color: var(--ink);
        font: 18px/1.2 "DW Fairfield", Georgia, serif;
        transition:
          transform 0.42s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.3s;
        overflow: hidden;
      }
      /* the drawn line round a box (drawBox in src/nav.mjs), as app.css .wobble draws Homegrown's */
      .wob {
        position: absolute;
        inset: -6px;
        width: calc(100% + 12px);
        height: calc(100% + 12px);
        z-index: -1;
        pointer-events: none;
        overflow: visible;
      }
      .wob path {
        fill: var(--fill, transparent);
        stroke: var(--line, var(--ink));
        stroke-width: 2px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      /* everything inside the card keeps the full ink (app.css .card > :not(svg)) */
      #win .body,
      #win .close {
        --line: var(--ink);
      }
      /* the body clips too, so it reaches 10px into the card's padding each side, as the words inside it do (.words): a
         button's drawn line runs 6px outside it. "both sides are a little cutoff" (Carl, 8 Nov 2026) */
      #win .body {
        padding-inline: 10px;
        margin-inline: -10px;
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
      }
      /* WHILE THERE IS MORE TO SCROLL, ITS EDGE FADES: "can the bottoms/tops of the card contents fade out when they're
         scrollable? i think we did this in homegrown somewhere?" (Carl, 3 Nov 2026). Homegrown's sidebar does it
         (app.css .nav[data-more], "Add a soft fade", 12 Oct 2026): a mask, so it fades whatever is under it. src/nav.mjs
         sets data-up while there is more above and data-down while there is more below. */
      #win .body[data-up],
      #win .body[data-down],
      #win .body > [data-up],
      #win .body > [data-down] {
        --fu: 0px;
        --fd: 0px;
        mask-image: linear-gradient(to bottom, transparent, #000 var(--fu), #000 calc(100% - var(--fd)), transparent);
      }
      #win .body[data-up],
      #win .body > [data-up] {
        --fu: 36px;
      }
      #win .body[data-down],
      #win .body > [data-down] {
        --fd: 36px;
      }
      /* the line under a card's title, in his heading face at the reading size: the contact card's "Hey Carl" line,
         "CONTACT (and then use the hey carl line as a subheadline)" (Carl, 3 Nov 2026) */
      .words h3.sub {
        margin: -4px 56px 4px 0;
        font: 400 var(--fs-body)/1.2 "DW Fairfield", Georgia, serif;
      }
      .words h2.next {
        margin-top: 22px;
      }
      /* SHEET: down the right side of the window, the thing framed in the room left of it */
      #win.sheet {
        top: 16px;
        right: 16px;
        bottom: 16px;
        /* "I feel like the cards could be a bit wider yeah?" (Carl, 2 Nov 2026): 520px and 40% until then */
        width: min(620px, 46%);
        transform: translateX(calc(100% + 40px));
      }
      #win.sheet.in {
        transform: none;
      }
      /* the portfolio's card, down the left: "let's move the card to the left side of the screen" (Carl, 2 Nov 2026) */
      #win.sheet.left {
        right: auto;
        left: 16px;
        transform: translateX(calc(-100% - 40px));
      }
      #win.sheet.left.in {
        transform: none;
      }
      /* THE PAPER SETTLES: it lands past its place and comes back, with some give ("they're quite subtle",
         Carl, 6 Oct 2026, of the first, which only just overshot) */
      .touches #win.sheet {
        transition:
          transform 0.62s cubic-bezier(0.2, 1.7, 0.4, 1),
          opacity 0.3s;
      }
      /* THE CARD SCALES WITH THE ROOM (src/stage.mjs --k): laid out as on his laptop, 620px wide, and drawn bigger or
         smaller with the room, so nothing rewraps: "I want the card contents to scale with the resizing" (Carl, 3 Nov
         2026). It replaces the short window's own layout (a phone on its side), which rewrapped everything. */
      body:not(.upright) #win.sheet {
        width: 620px;
        zoom: var(--k, 1);
      }
      /* upright, the card fills the phone's width and its words scale with that width */
      .upright #win .body {
        zoom: var(--k, 1);
      }
      /* what the window sits in: the room's card on a laptop, and on a phone upright what scrolls it */
      #winscroll {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        border-radius: 12px;
      }
      #win {
        pointer-events: auto;
      }
      /* A PHONE UPRIGHT (src/stage.mjs upright): the card comes up with its top at the middle of the screen, the thing
         framed above it, and is as long as its words; the card scrolls up over the room, its top never moving on the
         card: "the cards open on the bottom half instead of the top half. Then they are able to scroll down/be taller to
         fit" (Carl, 2 Nov 2026), then "Top of the card should stay fixed and the card's container height of whatever can
         get taller/longer to fit content". --half is set by src/stage.mjs. */
      /* THEN PINNED: the card stays in the bottom half at any window size and scrolls inside itself, so the thing above it
         stays in sight: "the card too needs to stay pinned (relative to the resized windows) so I can scroll to the other
         sleeves without covering up the player in the top half" (Carl, 3 Nov 2026). Until then the card grew as long as its
         words and the whole of it scrolled up over the room (his 2 Nov words above). The layer round it lets the room's
         taps through again; the card's own body takes the finger. */
      .upright #win.sheet {
        position: absolute;
        inset: var(--half, 50vh) 8px 8px;
        width: auto;
        margin: 0;
        padding: 24px 18px 20px;
        transform: translateY(calc(100% + 40px)); /* from below the screen, now the card is the whole of it */
        transition:
          transform 0.62s cubic-bezier(0.2, 1, 0.4, 1),
          opacity 0.3s;
      }
      .upright #win.sheet.in {
        transform: none;
      }
      /* THE HOME STRETCH: on a phone, once someone starts filling in a card's form, the card rises to fill the screen:
         "once i start typing, i'd like the card to take up the whole page since we don't need the dog to be in the way
         once they're at the home stretch of reaching out" (Carl, 3 Nov 2026). It stays up until the card closes. */
      .upright #win.sheet.full {
        top: 8px;
      }
      /* THE WHOLE SCREEN: then every card on a phone, from the moment it opens: "Whole screen" (Carl, 9 Nov 2026, the
         officers' fixes quiz, of the simplicity officer's "Quotes from 4 scrolls to 2"; asked knowing the player above is
         then out of sight). It replaces the bottom 65% (UPRIGHT_CARD) and the pinned card of 3 Nov. */
      .upright #win.sheet {
        top: 8px;
      }
      .upright #win.sheet {
        transition-property: transform, opacity, top;
      }
      .upright #win .body {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      .upright #win .body > * {
        overflow: visible;
        min-width: 0;
      }
      /* on a phone the card's whole body scrolls, so it is what clips: it reaches 8px into the card's own padding each
         side, its words staying where they were, so a button's or a field's drawn line (6px outside it) is never cut:
         "for the cards, especially on mobile, there is something weird happening with the padding and the buttons are
         getting cut off a little bit" (Carl, 3 Nov 2026) */
      .upright #win .body {
        padding-inline: 8px;
        margin-inline: -8px;
      }
      .upright #win .words {
        margin-inline: 0;
        padding-inline: 0;
      }
      /* the close X in a strip of its own along the card's top, so the words scroll away under the strip and never under
         the button (his officers' quiz, 7 Nov 2026: "Do them all") */
      .upright #win .body {
        margin-top: 34px;
      }
      @media (prefers-reduced-motion: reduce) {
        #win,
        #room {
          transition-duration: 0.12s;
        }
        #win.sheet {
          transform: none;
          opacity: 0;
        }
        #win.sheet.in {
          opacity: 1;
        }
        .upright #win.sheet {
          transform: none;
          transition: opacity 0.12s;
        }
      }
      #win .close {
        position: absolute;
        z-index: 1;
        top: 12px;
        right: 12px;
        width: 44px;
        height: 44px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
      }
      /* a finger's size on screen however small the card is drawn (src/stage.mjs NO SMALLER THAN THREE QUARTERS) */
      body:not(.upright) #win .close {
        width: calc(44px * max(1, 1 / var(--k, 1)));
        height: calc(44px * max(1, 1 / var(--k, 1)));
      }
      /* THE RED X (src/nav.mjs): Homegrown's drawing, 30px in its 44px button */
      #win .close img {
        display: block;
        width: 68%;
        height: 68%;
        margin: auto;
        object-fit: contain;
      }
      #win .close:active img {
        transform: scale(0.92);
      }
      [data-kbd] #win button:focus-visible,
      [data-kbd] #win input:focus-visible {
        outline: 3px solid var(--rust);
        outline-offset: 3px;
      }
      /* THE SHELLS: Carl's empty spaces, dashed, waiting for his words and pictures */
      .shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .slot {
        position: relative;
        border: 2px dashed rgb(44 44 42 / 0.4);
        border-radius: 10px;
      }
      .slot-names .slot::after {
        content: attr(data-slot);
        position: absolute;
        left: 8px;
        top: 6px;
        font-size: 13px;
        opacity: 0.5;
      }
      .slot.title {
        min-height: 46px;
        margin-right: 56px;
      }
      .slot.text {
        flex: 1;
        min-height: 180px;
      }
      .slot.photo {
        width: 62%;
        aspect-ratio: 4 / 5;
        flex: none;
      }
      /* CARL'S WORDS (src/nav.mjs WORDS): titles in DW Fairfield, the rest in a plain face that reads at length,
         his coloured words in the room's rust */
      .words {
        overflow-y: auto;
        /* room for a button's drawn line, which runs 6px outside it, so the scrolling box never clips its sides: "Buttons cut
           off" (Carl, 3 Nov 2026, on his phone), drawn out to the card's own edge; the words stay where they were */
        padding-left: 10px;
        margin-left: -10px;
        padding-right: 10px;
        margin-right: -10px;
        /* and no scrollbar of its own: "padding is still cutting stuff off" (Carl, 8 Nov 2026, the player's two buttons cut
           on the right). A Mac set to always show scrollbars put one inside this box, taking the room the buttons' line
           runs in; the faded edge (WHILE THERE IS MORE TO SCROLL) already says there is more */
        scrollbar-width: none;
        /* Homegrown's body: DM Sans at --fs-body (1.05rem); its headings DW Fairfield at --fs-heading (1.7rem) */
        /* up from Homegrown's 1.05rem to read easier on a laptop: "is the text size too small?", then "yeah" (Carl, 2 Nov
           2026). Every card's words, not the bio alone. */
        font: var(--fs-body)/1.4 "DM Sans", system-ui, sans-serif;
      }
      .words::-webkit-scrollbar {
        display: none;
      }
      .words h2 {
        margin: 0 56px 4px 0;
        font: 400 var(--fs-heading)/0.95 "DW Fairfield", Georgia, serif;
      }
      .words p {
        margin: 0;
      }
      .words .hi {
        color: var(--rust);
        font-weight: 700;
      }
      .words .stars {
        margin: 0;
        padding-left: 1.2em;
        display: grid;
        gap: 6px;
      }
      /* HOMEGROWN'S BUTTON (app.css .btn): DM Sans bold capitals at --fs-body, 0.02em apart, mustard with a charcoal
         line, at least 30px tall and 7rem wide, 16px each side; the window's one action boils (drawBox `live`) */
      .words-button {
        align-self: flex-start;
        position: relative;
        z-index: 0;
        min-height: 1.875rem;
        min-width: 7rem;
        padding: 6px 16px;
        border: none;
        background: none;
        --fill: #f6cc60;
        --line: #2c2c2a;
        color: #2c2c2a;
        font: 700 var(--fs-body)/1.2 "DM Sans", system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      /* the quiet one: its line and no fill, beside the one mustard action (Spotify under the songs, 7 Nov 2026) */
      /* NOW PLAYING (src/nav.mjs): a song left playing, in the room's bottom corner (on a phone upright, its top, clear of
         the card), its name and a pause and a stop, drawn as the cards are */
      .now-playing {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: min(440px, calc(100% - 32px));
        padding: 8px 10px 8px 14px;
        --fill: #fcf7e8;
        --line: #2c2c2a;
        color: #2c2c2a;
        font: 400 14px/1.2 "DM Sans", system-ui, sans-serif;
      }
      .upright .now-playing {
        top: 12px;
        bottom: auto;
      }
      /* and at the bottom while a card is open, out of the way of the card's close X: "Move it out of the way" (Carl, 9 Nov
         2026, the officers' fixes quiz; the delight officer found a tap on the X stopping the song instead). The card's
         words scroll clear of it. */
      .upright.win-open .now-playing {
        top: auto;
        bottom: 12px;
      }
      .upright.win-open:has(.now-playing) #win .body {
        padding-bottom: 76px;
      }
      /* A ROW OF WORDS ON A PHONE (src/nav.mjs): every page's word along the bottom of the room, the walls' cream with their
         charcoal outline, while no card is open */
      .phone-row {
        display: none;
      }
      .upright:not(.win-open):not(.going) .phone-row {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2px 6px;
      }
      .phone-row button {
        min-height: 44px;
        padding: 6px 8px;
        border: 0;
        background: none;
        color: #fdfaf0;
        font: 400 22px/1 "DW Fairfield", Georgia, serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        -webkit-text-stroke: 5px #2c2c2a;
        paint-order: stroke fill;
        cursor: pointer;
      }
      .phone-row button:active {
        transform: scale(0.94);
      }
      .np-words {
        position: relative;
        z-index: 1;
        display: grid;
        min-width: 0;

      /* THE QUOTES, given room: "can we make the quotes card look better? It's all kinda 'jammed together as a placeholder'

      /* well apart from each other, and from the button under the last, but the first sits the card's ordinary 14px under

      /* the logos under the bio, running past (src/nav.mjs THE LOGOS under the bio): smaller than their page had them,

      .logo-strip {

      .logos {

      /* HOMEGROWN'S FIELD (app.css .fieldbox): the box drawn round the field, white, its line at 55% ink */
      .fieldbox {

      /* the toast a sent message raises over the top of its card (src/nav.mjs SENT, SAID WHERE IT IS SEEN) */
      #win .toast {

        left: 50%;

      /* the drum's page: the logos alone (the tour photos it was to hold went, 2 Nov 2026) */
      .shell.photos {

      /* the sleeves: a grid of squares, each a track's name and length under it */
      /* six sleeves, in threes, or twos when the card is narrow: "if i did 6, could we do groups of 2s or 3s depending on
         the resizing?" (Carl, 2 Nov 2026). The card's own width decides, not the window's (a phone and a laptop's card) */
      .player {
        container-type: inline-size;
      }
      /* then four: two by two for a moment, then three across again, smaller, so the next row shows and there are plainly
         more: "id like the artwork to be a bit smaller so it's clear there are more than two and if i need to scroll, it's
         obvious" (Carl, 2 Nov 2026). Two across when the card is narrow, as before */
      /* then two by two again: "can we also make these two rows of two songs instead of a row of 3 and a row of 1?" (Carl,
         8 Nov 2026) */
      .sleeves {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        /* with room round them, so they come out smaller: "they should have more padding between them so they can be a
           bit smaller" (Carl, 8 Nov 2026). 14px and 12px apart, and nothing at the sides, until then */
        gap: 26px 48px;
        padding: 4px 44px; /* and room for each sleeve's drawn line, which the scrolling card would clip */
      }
      @container (max-width: 440px) {
        .sleeves {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

      /* each sleeve as tall as its own name, so a longer name beside it never stretches it out of square */
      .sleeve-pick {
        align-self: start;
        align-content: start;
        display: grid;
        gap: 4px;
        padding: 0;
        border: none;
        background: none;
        text-align: left;
        color: inherit;
        font: inherit;

      .slot.sleeve {

      .slot.sleeve {

      .slot.sleeve.cover-art {

      /* A RECORD, on the page: his record drawing (assets/deck-record.webp), the song's cover in its label, zoomed as his
         kit zooms it (--pp-label-zoom 1.9), the spindle hole drawn over it */
      .vinyl {
        border-radius: 50%;
        background: url("assets/deck-record.webp") center / 100% 100% no-repeat;
      }

        position: absolute;
        left: 29.5%;
        top: 29.5%;
        width: 41%;
        height: 41%;
        border-radius: 50%;
        background-size: 100%; /* the whole cover, as on the deck (props.mjs LABEL_ZOOM) */
        background-position: center;
        box-shadow: 0 0 0 2px #1b1b1a;
      }
      .vinyl-label::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10.7%;
        height: 10.7%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #1b1b1a;
        box-shadow: 0 0 0 3px #f4ead8;
      }
      .flier {
        position: fixed;
        pointer-events: none;
        will-change: transform;

      /* the sleeve and the record in it: under the mouse the record slides out of the sleeve to the right */
      .sleeve-stack {
        position: relative;

      .sleeve-peek {
        position: absolute;
        inset: 3%;
        transition:
          transform 0.42s cubic-bezier(0.22, 0.75, 0.28, 1),
          opacity 0.2s;
      }
      .sleeve-stack .slot.sleeve {
        position: relative;
        z-index: 1;

        z-index: 0;

        z-index: 3;

      .sleeve-pick:focus-visible .sleeve-peek {
        transform: translateX(30%);
      }
      /* its record out of it, flying or on the deck: the sleeve reads as empty */
      .sleeve-pick[data-state="flying"] .sleeve-peek,
      .sleeve-pick[data-state="out"] .sleeve-peek,
      .sleeve-pick[data-state="deck"] .sleeve-peek {

      /* THE VIEW EDITOR (src/viewtune.mjs), in its own artifact only (build-editor.sh) */

      /* THE SOUND BUTTON (src/sound.mjs): the garden's speaker on its corner card (app.css .garden-sound), bottom right
         of the room's card: "Bottom right" (Carl, 2 Nov 2026, the room sound quiz). It sits over a window's sheet when

      #sound {

        height: 44px;
        padding: 8px;
        border: none;
        background: none;
        --fill: #fcf7e8;
        --line: #2c2c2a;
        cursor: pointer;
      }
      #sound[hidden] {
        display: none;
      }
      #sound img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      [data-kbd] #sound:focus-visible {
        outline: 3px solid var(--rust);
        outline-offset: 3px;
      }
      #arrange :focus-visible {
        outline: 2px solid #bf7538;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <!-- THE CONTACT FORM, AS NETLIFY SEES IT: Netlify finds a site's forms by reading its pages as they are built, and the
         card's form is drawn by src/nav.mjs after load, so this hidden copy names it and its fields for Netlify. The card
         posts to it (src/nav.mjs WHAT HAPPENS AFTER SEND); nobody sees this one. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="subject" /><textarea name="message"></textarea>
    </form>
    <div id="stage">
    <canvas
      id="room"
      role="img"
      aria-label="Carl Bahner’s studio"
    ></canvas>
    <div id="things"></div>
    <div id="loading" aria-hidden="true"><img src="assets/loading-cb.webp" alt="" /></div>
    <div id="veil" hidden></div>
    <div id="winscroll">
    <div id="win" role="dialog" aria-modal="true" hidden>
      <button type="button" class="close" aria-label="Close">
        <img src="assets/icon-cancel.webp" alt="" aria-hidden="true" />
      </button>
      <div class="body"></div>
    </div>
    </div>
    </div>
    <div id="turn" hidden>
      <svg viewBox="0 0 120 128" aria-hidden="true">
        <path class="arrow" data-boil d="M26 30 C 34 12, 70 4, 92 22 M84 13 L93 23 L81 27" />
        <path class="phone" data-boil d="M42 32 h36 a7 7 0 0 1 7 7 v54 a7 7 0 0 1 -7 7 h-36 a7 7 0 0 1 -7 -7 v-54 a7 7 0 0 1 7 -7 Z M54 92 h12" />
      </svg>
    </div>
    <div id="arrange" hidden><button type="button">Save</button></div>
    <script type="module" src="src/studio.mjs"></script>
  </body>
</html>
